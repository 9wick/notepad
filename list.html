<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>memo list</title>
<link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #fafafa;
    color: #1a1a1a;
    font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1a1a1a; color: #e8e8e8; }
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 16px;
  }
  li {
    border-bottom: 1px solid rgba(128, 128, 128, 0.3);
  }
  li:first-child {
    border-top: 1px solid rgba(128, 128, 128, 0.3);
  }
  a {
    display: block;
    padding: 12px 4px;
    color: inherit;
    text-decoration: none;
  }
  a:hover {
    background: rgba(128, 128, 128, 0.1);
  }
  .date {
    font-size: 0.85em;
    opacity: 0.7;
    margin-bottom: 4px;
  }
  .preview {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
  }
  .empty {
    padding: 16px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<ul id="list"></ul>
<script src="storage.js"></script>
<script>
  cleanup();

  const listEl = document.getElementById("list");
  const notes = listNotes();

  if (notes.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "メモはありません";
    listEl.replaceWith(empty);
  } else {
    for (const note of notes) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = `./?id=${encodeURIComponent(note.id)}`;

      const date = document.createElement("div");
      date.className = "date";
      date.textContent = new Date(note.updatedAt).toLocaleString();

      const preview = document.createElement("div");
      preview.className = "preview";
      // 本文は必ず textContent で挿入する（innerHTML への混入を避け HTML/XSS を防ぐ）
      preview.textContent = note.text;

      a.appendChild(date);
      a.appendChild(preview);
      li.appendChild(a);
      listEl.appendChild(li);
    }
  }
</script>
</body>
</html>
