<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>memo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fafafa;
    color: #1a1a1a;
  }
  textarea {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    padding: 16px;
    box-sizing: border-box;
    background: transparent;
    color: inherit;
    font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1a1a1a; color: #e8e8e8; }
  }
</style>
</head>
<body>
<textarea id="memo" autofocus spellcheck="false"></textarea>
<script>
  const KEY = "memo";
  const el = document.getElementById("memo");
  el.value = sessionStorage.getItem(KEY) ?? "";
  el.addEventListener("input", () => sessionStorage.setItem(KEY, el.value));
</script>
</body>
</html>
