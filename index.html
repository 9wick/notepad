<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>memo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fafafa;
    color: #1a1a1a;
  }
  textarea {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    padding: 16px;
    box-sizing: border-box;
    background: transparent;
    color: inherit;
    font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1a1a1a; color: #e8e8e8; }
  }
  .fab {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    border: 1px solid rgba(128, 128, 128, 0.3);
    border-radius: 6px;
    color: inherit;
    opacity: 0.6;
    /* 本文がボタン下に回り込んでも読めるよう、ページ背景で下敷きにする */
    background: inherit;
    transition: opacity 0.15s;
  }
  .fab:hover {
    opacity: 1;
  }
</style>
</head>
<body>
<textarea id="memo" autofocus spellcheck="false"></textarea>
<a class="fab" href="./list.html" title="メモ一覧" aria-label="メモ一覧">
  <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
  </svg>
</a>
<script src="storage.js"></script>
<script>
  cleanup();

  const params = new URLSearchParams(location.search);
  let id = params.get("id");
  if (!id) {
    // 素の URL を開くたびに新しいメモにするため、id 未指定時はここで発行する
    id = crypto.randomUUID();
    params.set("id", id);
    history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
  }

  const el = document.getElementById("memo");
  const note = loadNote(id);
  el.value = note ? note.text : "";
  el.addEventListener("input", () => saveNote(id, el.value));
</script>
</body>
</html>
